[project]
name = "pydepin"
version = "0.4.0"
description = "Type-first dependency-injection library for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "André Lopes", email = "andrelopes.code@gmail.com" }]
keywords = [
    "dependency-injection",
    "di",
    "ioc",
    "inversion-of-control",
    "typing",
    "type-hints",
    "annotated",
    "protocol",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.133", "starlette>=1.1"]

[project.urls]
Homepage = "https://andrelopes-code.github.io/depin/"
Documentation = "https://andrelopes-code.github.io/depin/"
Repository = "https://github.com/andrelopes-code/depin"
Issues = "https://github.com/andrelopes-code/depin/issues"
Changelog = "https://github.com/andrelopes-code/depin/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.16.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1.0",
    "httpx>=0.27",
    "fastapi>=0.133",
]
docs = [
    # MkDocs 2.0 removes the plugin system and the theming system with no
    # migration path, which breaks mkdocstrings and Material. Cap until the
    # ecosystem settles.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=1.0.4",
    "fastapi>=0.133",
    "starlette>=1.1",
    "mike>=2.2.0",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depin"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.flake8-bugbear]
# injected() is designed to sit in default-value position; it returns a fresh
# marker each call with no shared mutable state, so B008 does not apply to it.
extend-immutable-calls = ["depin.injected", "depin._core.markers.injected"]

[tool.basedpyright]
include = ["depin", "tests", "examples"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportImplicitOverride = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests", "depin", "docs"]
# `examples/` is not part of the distribution; tests/integration imports it from the
# working tree so the published examples stay executable.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --doctest-modules --doctest-glob=*.md"

[tool.coverage.run]
source = ["depin"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
