[project]
name = "pydepin"
version = "0.17.1"
description = "Type-first dependency-injection library for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "André Lopes", email = "andrelopes.code@gmail.com" }]
keywords = [
    "dependency-injection",
    "di",
    "ioc",
    "inversion-of-control",
    "typing",
    "type-hints",
    "annotated",
    "protocol",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# `depin.ext.click` touches two names — `click.Context` and its
# `with_resource` — and both date from 8.0, so the floor is not a feature gate.
# It is 8.1 because that is the oldest release the suite is run against:
# probed on 8.1.0, `tests/unit/test_cli.py`, `tests/integration/test_click_ext.py`
# and the Click example all pass, with the declared Typer floor sharing that
# Click.
click = ["click>=8.1"]
fastapi = ["fastapi>=0.133", "starlette>=1.1"]
flask = ["flask>=3.1"]
litestar = ["litestar>=2.13"]
pytest = ["pytest>=9.0.3"]
starlette = ["starlette>=1.1"]
# The middleware contract `MessageScope` implements — `pre_execute` /
# `post_execute`, and the `TaskiqMessage` they carry — is identical from 0.11.0
# on. The floor is 0.11.19 for a guarantee outside that contract: it is the
# first release whose receiver runs a synchronous task body under
# `contextvars.copy_context()`, so the scope opened in `pre_execute` reaches a
# `def` body in the executor thread. Below it `hosted_container()` raises
# `ContainerNotBoundError` there.
taskiq = ["taskiq>=0.11.19"]
# Not floored at the 0.26 release that vendored Click — the command seam is a
# protocol, so it spans that split. Floored at 0.16 because the `click` extra
# names no ceiling and the two share whatever Click is installed: Click 8.2
# made `Parameter.make_metavar()` take a context and Typer passes one only from
# 0.16, so Typer 0.15 beside Click 8.2.1 raises `TypeError` on `--help`.
typer = ["typer>=0.16"]

# Declared by the distribution rather than by the extra, because that is how
# pytest discovers a plugin. The extra states the floor the plugin is tested
# against; `minimum-versions` and `latest-versions` exercise both ends.
[project.entry-points.pytest11]
depin = "depin.ext.pytest"

[project.urls]
Homepage = "https://andrelopes-code.github.io/depin/"
Documentation = "https://andrelopes-code.github.io/depin/"
Repository = "https://github.com/andrelopes-code/depin"
Issues = "https://github.com/andrelopes-code/depin/issues"
Changelog = "https://github.com/andrelopes-code/depin/blob/main/CHANGELOG.md"

[dependency-groups]
# Hypothesis 6.156+ uses a Rust extension without a 3.13t wheel, and PyO3 supports free-threading only from 3.14.
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.16.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1.0",
    # CI measures coverage with `coverage run -m pytest`, so the tool is a
    # direct dependency rather than one reached through pytest-cov.
    "coverage[toml]>=7.10",
    "httpx>=0.27",
    "fastapi>=0.133",
    "mypy>=1.18",
    "hypothesis>=6.138,<6.156",
    "mutmut>=3.7,<4",
    "pytest-timeout>=2.4,<3",
]
# The extended matrix runs free-threaded and pre-release interpreters, where
# `fastapi` and its compiled transitive dependencies have no wheels. The core
# has zero runtime dependencies, so it needs nothing but a test runner.
threads = [
    "hypothesis>=6.138,<6.156",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1,<8",
    # The property modules carry a `timeout` marker, and `--strict-markers`
    # fails collection when the plugin that defines it is absent.
    "pytest-timeout>=2.4,<3",
]
# Tier 3 drives a real FastAPI application in process through
# `httpx.ASGITransport`, so the benchmark job needs both even though the core
# has zero runtime dependencies.
bench = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "pytest-benchmark>=5.1",
    "fastapi>=0.133",
    "httpx>=0.27",
]
docs = [
    # MkDocs 2.0 removes the plugin system and the theming system with no
    # migration path, which breaks mkdocstrings and Material. Cap until the
    # ecosystem settles.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=1.0.4",
    "fastapi>=0.133",
    "starlette>=1.1",
    "mike>=2.2.0",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depin"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "T20"]

[tool.ruff.lint.isort]
case-sensitive = true

# print() is the point of these files: runnable examples, and the CLI scripts
# that report to stdout/stderr. Everywhere else, T20 stays enforced.
[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T20"]
"scripts/check_mutation_threshold.py" = ["T20"]
"scripts/conformance/**" = ["T20"]
"scripts/forward.py" = ["T20"]
"benchmarks/harness/*.py" = ["T20"]

[tool.ruff.lint.flake8-bugbear]
# injected() is designed to sit in default-value position; it returns a fresh
# marker each call with no shared mutable state, so B008 does not apply to it.
extend-immutable-calls = ["depin.injected", "depin._core.markers.injected"]

[tool.basedpyright]
include = ["depin", "tests", "examples", "scripts", "benchmarks"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportImplicitOverride = true
reportMissingTypeStubs = false

# The file list mirrors `[tool.basedpyright] include` exactly. The two checkers
# must see the same code, or "both are clean" means nothing.
[tool.mypy]
python_version = "3.12"
files = ["depin", "tests", "examples", "scripts", "benchmarks"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "ignore-without-code"]

# The file list ty checks. Blocking, through the `typing-source` job: not at
# zero, but against `conformance/expected/ty-source.txt`, which records each
# tolerated diagnostic as a `file:rule:count` triple with a classification. The
# list mirrors `[tool.basedpyright] include` exactly, for the same reason mypy's
# does. Pyrefly's equivalent is the root `pyrefly.toml`; ty is the only one of
# the two with a `pyproject.toml` table.
[tool.ty.src]
include = ["depin", "tests", "examples", "scripts", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests", "depin", "docs"]
# `examples/` is not part of the distribution; tests/integration imports it from the
# working tree so the published examples stay executable.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --doctest-modules --doctest-glob=*.md"
# `benchmarks/test_latency.py` carries a per-case `benchmark(min_rounds=...)`
# marker, and `tests/integration` imports that module for the workload inventory,
# so the ordinary suite reaches the marker in an environment where
# `pytest-benchmark` is not installed — it lives only in the `bench` group, which
# is what keeps the framework out of the free-threaded job. Declaring the name
# here is what stops `--strict-markers` failing collection there; the plugin
# declares it again when it is present, which pytest merges.
markers = [
    "benchmark: pytest-benchmark's marker, carrying each case's derived rounds floor",
]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.coverage.run]
source = ["depin"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mutmut]
source_paths = ["depin"]
# mutmut runs `pytest tests/unit` from inside `mutants/`, so anything the unit
# suite reads from the working tree has to be copied there too.
# `conformance/coverage.toml` is read at collection time by
# `tests/unit/test_conformance_coverage.py`, which parametrises over it.
also_copy = ["scripts", "conformance"]
only_mutate = ["depin/_core/*.py"]
pytest_add_cli_args = ["--timeout=2"]
pytest_add_cli_args_test_selection = ["tests/unit"]
