# mypy's consumer settings are command-line flags — `--strict`,
# `--warn-unreachable`, and `--disallow-any-expr` on the anti-erasure pass over
# `corpus/core`. This file carries the one setting that is not a constant, the
# interpreter whose site-packages the corpus is checked against, and it is
# passed with `--config-file` so mypy cannot discover an unrelated
# configuration from the working directory or the user's home.

[mypy]
python_executable = ${python}
