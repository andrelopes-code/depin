# One entry per public symbol. An entry either names the fixtures that exercise
# it or records an explicit decision not to, with a reason.
#
# `tests/unit/test_conformance_coverage.py` enumerates the public surface from
# three sources and fails when a name has no entry here, so a new public symbol
# cannot land without a type-test decision. It also fails on an entry for a name
# that is no longer public, so this file shrinks when the surface does.
#
# The three sources: `depin.__all__` and `depin.errors`, both imported, keyed by
# their bare name and by `depin.errors.<Name>`; and `depin/ext/`, parsed with
# `ast` and never imported — that test runs on the free-threaded and pre-release
# jobs, where no framework is installed — keyed by `depin.ext.<module>.<Name>`.
#
# Fixture paths are relative to `conformance/`.
#
# Class members are out of scope. Adding `Container.foo()` passes this gate; the
# corpus is what guards members, by exercising them. `conformance/README.md`
# records that as a decision rather than leaving it a hole.

