name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# release-please rewrites the release pull request from the state of main. Two
# overlapping runs read different states and fight over that branch, which is how
# a duplicate release pull request appears.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.pr.outputs.branch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "${RELEASE_PR:-}" | jq -r '.headBranchName // empty')
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

  lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # release-please bumps the version in pyproject.toml but knows nothing about
    # uv.lock, which records the project's own version too. Left alone, the
    # release commit lands on main with a stale lockfile and every branch cut
    # from it fails `uv sync --locked`.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'

      - name: Refresh the lockfile
        run: uv lock

      - name: Commit it onto the release pull request
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock already matches the bumped version'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: sync uv.lock with the released version'
          git push

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pydepin
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # The site publishes from here rather than from a `release` trigger in
    # docs.yml: release-please creates the release with GITHUB_TOKEN, and GitHub
    # does not start workflows from events raised by that token, so such a
    # trigger would never fire. Running in this workflow keeps it in the same run
    # as the release that produced the tag.
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      # mike reads and rewrites the gh-pages branch, which a shallow clone omits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Configure git for the deploy commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # One directory per minor series, with `latest` and the site root moved
      # onto the version just released.
      - name: Publish the released documentation
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          version="${tag%.*}"
          uv run --group docs mike deploy --push --update-aliases "${version}" latest
          uv run --group docs mike set-default --push latest
