name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# release-please rewrites the release pull request from the state of main. Two
# overlapping runs read different states and fight over that branch, which is how
# a duplicate release pull request appears.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.pr.outputs.branch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "${RELEASE_PR:-}" | jq -r '.headBranchName // empty')
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

  lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # release-please bumps the version in pyproject.toml but knows nothing about
    # uv.lock, which records the project's own version too. Left alone, the
    # release commit lands on main with a stale lockfile and every branch cut
    # from it fails `uv sync --locked`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Checking the branch out by name would hard-fail if it vanished between
      # the two jobs, which is what happens when the release pull request is
      # closed while the workflow is running. There is nothing to update then.
      - name: Switch to the release branch
        id: branch
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          set -euo pipefail
          if ! git fetch --depth=1 origin "${BRANCH}"; then
            echo "the release branch ${BRANCH} no longer exists; nothing to update"
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "${BRANCH}" FETCH_HEAD
          echo 'present=true' >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.branch.outputs.present == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Refresh the lockfile
        if: steps.branch.outputs.present == 'true'
        run: uv lock

      - name: Commit it onto the release pull request
        if: steps.branch.outputs.present == 'true'
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock already matches the bumped version'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: sync uv.lock with the released version'
          git push origin "HEAD:${BRANCH}"

  verify-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-verification.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pydepin
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

      # The SBOM is generated from an environment with the built wheel and its
      # optional extra installed, so it records what a consumer actually gets
      # rather than what the lockfile happens to hold.
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          uv venv /tmp/sbom
          uv pip install --python /tmp/sbom "$(echo dist/*.whl)[fastapi]"
          uvx --from cyclonedx-bom cyclonedx-py environment /tmp/sbom \
            --output-format JSON --output-file sbom.cdx.json

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" sbom.cdx.json --clobber

  docs:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # The site publishes from here rather than from a `release` trigger in
    # docs.yml: release-please creates the release with GITHUB_TOKEN, and GitHub
    # does not start workflows from events raised by that token, so such a
    # trigger would never fire. Running in this workflow keeps it in the same run
    # as the release that produced the tag.
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      # mike reads and rewrites the gh-pages branch, which a shallow clone omits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Configure git for the deploy commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # One directory per minor series, with `latest` and the site root moved
      # onto the version just released.
      - name: Publish the released documentation
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          version="${tag%.*}"
          uv run --group docs mike deploy --push --update-aliases "${version}" latest
          uv run --group docs mike set-default --push latest
