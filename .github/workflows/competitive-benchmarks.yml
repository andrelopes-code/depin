name: Competitive benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline-revision:
        description: 'Clean Git revision to compare with this checkout'
        required: true
      repetitions:
        description: 'Counterbalanced repetitions per collection'
        required: false
        default: '5'
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: competitive-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'competitive-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASELINE_DIR: ${{ runner.temp }}/depin-comparison-base
      BASELINE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline-revision }}
      ARTIFACT_DIR: ${{ runner.temp }}/competitive-benchmark-artifacts
      REPETITIONS: ${{ inputs.repetitions || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Prepare artifact placeholders
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/null" "$ARTIFACT_DIR/real"
          printf '{"status":"null collection did not complete"}\n' > "$ARTIFACT_DIR/null/comparison.json"
          printf '{"status":"real collection did not complete"}\n' > "$ARTIFACT_DIR/real/comparison.json"
          printf '{"status":"calibration did not complete"}\n' > "$ARTIFACT_DIR/calibration.json"
          printf '# Competitive performance evidence pending\n' > "$ARTIFACT_DIR/competitive-benchmarks.md"
          printf 'Collection did not complete; inspect the job steps above.\n' > "$ARTIFACT_DIR/status.txt"

      - name: Install the locked benchmark environment
        run: uv sync --locked --no-default-groups --group bench

      - name: Materialize the baseline revision
        run: |
          set -euo pipefail
          mkdir -p "$BASELINE_DIR"
          git archive "$BASELINE_REVISION" | tar -x -C "$BASELINE_DIR"
          printf '%s\n' "$BASELINE_REVISION" > "$BASELINE_DIR/.depin-baseline-revision"

      - name: Observe adapter equivalence before collection
        run: uv run --no-sync pytest benchmarks/test_comparison.py -q

      - name: Collect null evidence
        run: >
          uv run --no-sync python -m benchmarks.comparison.collection collect --null
          --repetitions "$REPETITIONS" --out "$ARTIFACT_DIR/null"
          --baseline-dir "$BASELINE_DIR" --baseline-revision "$BASELINE_REVISION" --budgets benchmarks/budgets.toml
          --timeout-seconds 1500

      - name: Calibrate null evidence
        run: >
          uv run --no-sync python -m benchmarks.comparison.leadership calibrate
          "$ARTIFACT_DIR/null" --out "$ARTIFACT_DIR/calibration.json"

      - name: Collect competitive evidence
        run: >
          uv run --no-sync python -m benchmarks.comparison.collection collect
          --repetitions "$REPETITIONS" --out "$ARTIFACT_DIR/real"
          --baseline-dir "$BASELINE_DIR" --baseline-revision "$BASELINE_REVISION" --budgets benchmarks/budgets.toml
          --timeout-seconds 4500

      - name: Evaluate competitive evidence
        run: >
          uv run --no-sync python -m benchmarks.comparison.leadership evaluate
          "$ARTIFACT_DIR/real" --calibration "$ARTIFACT_DIR/calibration.json"
          --budgets benchmarks/budgets.toml

      - name: Render Markdown summary
        if: always()
        run: |
          set +e
          uv run --no-sync python -m benchmarks.comparison.report \
            "$ARTIFACT_DIR/real" --calibration "$ARTIFACT_DIR/calibration.json" \
            --budgets benchmarks/budgets.toml > "$ARTIFACT_DIR/.competitive-benchmarks.md"
          command_result=$?
          if [ "$command_result" -eq 0 ]; then
            mv "$ARTIFACT_DIR/.competitive-benchmarks.md" "$ARTIFACT_DIR/competitive-benchmarks.md"
            printf 'Collection and report completed.\n' > "$ARTIFACT_DIR/status.txt"
          else
            rm -f "$ARTIFACT_DIR/.competitive-benchmarks.md"
            printf '# Comparative performance evidence unavailable\n' > "$ARTIFACT_DIR/competitive-benchmarks.md"
            printf 'The report could not be rendered; inspect the collection, calibration, and evaluation steps.\n' > "$ARTIFACT_DIR/status.txt"
          fi
          cat "$ARTIFACT_DIR/competitive-benchmarks.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$command_result"

      - name: Upload competitive benchmark evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: competitive-benchmark-evidence
          path: ${{ runner.temp }}/competitive-benchmark-artifacts
          if-no-files-found: error
          retention-days: 14
