name: Mutation testing

on:
  pull_request:
    paths:
      - 'depin/_core/**'
      - 'tests/**'
      - 'scripts/check_mutation_threshold.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run mutation tests
        run: uv run mutmut run

      - name: Export mutation statistics
        run: uv run mutmut export-cicd-stats

      - name: Enforce mutation threshold
        run: uv run python -m scripts.check_mutation_threshold mutants/mutmut-cicd-stats.json

      - name: Report mutation results
        run: uv run mutmut results

      - name: Upload mutation statistics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutmut-cicd-stats
          path: mutants/mutmut-cicd-stats.json
