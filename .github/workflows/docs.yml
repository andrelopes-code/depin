name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish the current tree under this version and alias it as latest. Leave empty to publish dev only.'
        required: false
        default: ''

permissions: {}

# mike pushes to the gh-pages branch, so two runs must never overlap.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # mike reads and rewrites the gh-pages branch, which a shallow clone omits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Configure git for the deploy commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # A push to main refreshes `dev`. Released versions are published by the
      # release workflow, which owns the tag. The `version` input is the manual
      # escape hatch for republishing a version out of band.
      - name: Publish
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${MANUAL_VERSION}" ]; then
            uv run --group docs mike deploy --push --update-aliases dev
            exit 0
          fi
          uv run --group docs mike deploy --push --update-aliases "${MANUAL_VERSION}" latest
          uv run --group docs mike set-default --push latest
