name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      # The `pythonVersion` pinned in pyproject.toml is the floor; the matrix
      # entry is what this job actually runs, and it is what gets checked here.
      - name: Type check
        run: uv run basedpyright --pythonversion ${{ matrix.python-version }}

      - name: Type check with mypy
        run: uv run mypy --python-version ${{ matrix.python-version }}

      # `pytest --cov=depin` starts the coverage collector from inside a
      # pytest-cov plugin hook, which runs after `_preparse` has already
      # loaded every `pytest11` entry point — including `depin.ext.pytest`,
      # which imports the whole `depin` package. `coverage run -m pytest`
      # starts the collector first, before the interpreter imports anything,
      # so it sees that import.
      #
      # One command per step: this matrix includes `windows-latest`, where a
      # multi-command `run:` block exits with the status of its last command
      # alone, so a failing test run followed by a passing report would leave
      # the step green.
      - name: Test
        run: uv run coverage run -m pytest

      - name: Write the coverage XML
        run: uv run coverage xml

      - name: Report coverage
        run: uv run coverage report --show-missing

      # Skipped entirely until CODECOV_TOKEN exists, so the absence of the
      # secret is visible as a skipped step rather than hidden behind a
      # tokenless upload that silently fails.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  free-threaded:
    name: free-threaded ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # The core has zero runtime dependencies and installs on any interpreter.
      # `fastapi` and its compiled transitive dependencies do not ship
      # free-threaded wheels for every version here, so the default dev group is
      # excluded and only the core unit suite runs.
      - name: Sync the thread-test group only
        run: uv sync --no-default-groups --group threads

      # Without this, a build that silently re-enabled the GIL would produce a
      # green job that proves nothing about the library's own locks.
      - name: Assert the GIL is disabled
        run: >
          uv run --no-sync python -c
          "import sys; assert sys._is_gil_enabled() is False, 'the GIL is enabled; this job proves nothing'"

      # No coverage here. This job runs `tests/unit` only, so every module
      # under `depin/ext/` is unexercised and drags the total toward the floor
      # for a reason that has nothing to do with the locks this job tests. The
      # `checks` job measures coverage against the whole suite.
      - name: Test
        run: uv run --no-sync pytest tests/unit

  prerelease:
    name: python 3.15 pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advance warning of an interpreter change, not a merge gate: a pre-release
    # regression is upstream's until it ships.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.15'

      - name: Sync the thread-test group only
        run: uv sync --no-default-groups --group threads

      - name: Test
        run: uv run --no-sync pytest tests/unit

  ty:
    name: ty (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ty is still on 0.0.x versioning with no stable API, and its own docs warn
    # that diagnostics can change between any two releases. Advance signal from
    # a second, independently-implemented checker, not a merge gate. The
    # diagnostics it reports are deliberately left unfixed while ty is
    # pre-stable, so the check step below always exits 0 and surfaces them
    # in the job summary instead of showing a permanently red check that
    # trains reviewers to ignore it. continue-on-error here backstops the
    # job's other steps instead — checkout, Install uv, Sync dependencies, or
    # a failed write to the step summary — because the `uvx` invocation
    # already exits 0 on its own via `|| true`, "command not found" included.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      # Run through uvx instead of the dev group: a 0.0.x tool with no stable
      # API has no business in uv.lock or every contributor's environment, and
      # this advisory job wants whatever ty currently does, not a pinned cut.
      # Paths come from `[tool.ty.src] include` in pyproject.toml, not a
      # literal list here, so they cannot drift from what the other checkers see.
      - name: Type check with ty
        run: |
          set -euo pipefail
          set +e
          output="$(uvx ty check 2>&1)"
          status=$?
          set -e
          echo "$output"
          {
            echo '### ty (advisory) diagnostics'
            echo
            echo "exit status: $status"
            echo
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Both sides are measured on this runner, back to back. A baseline stored
      # in the repository would have been measured on a different machine, and
      # the comparison would report hardware rather than code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          # This job's own `uv sync` runs only when the base branch carries a
          # benchmark suite; when it doesn't, nothing here ever installs, and
          # the cache post-step then errors because there is nothing to save.
          enable-cache: false

      - name: Measure the base branch
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git worktree add /tmp/base "origin/${BASE_REF}"
          if [ ! -d /tmp/base/benchmarks ]; then
            echo "base branch carries no benchmark suite; nothing to compare against, skipping the gate"
            echo 'has-suite=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has-suite=true' >> "$GITHUB_OUTPUT"
          cd /tmp/base
          uv sync --no-default-groups --group bench
          uv run --no-sync pytest benchmarks --benchmark-only --benchmark-json=/tmp/base.json

      - name: Measure this branch
        if: steps.base.outputs.has-suite == 'true'
        run: |
          set -euo pipefail
          uv sync --no-default-groups --group bench
          uv run --no-sync pytest benchmarks --benchmark-only --benchmark-json=/tmp/head.json

      # Shared CI runners are noisy; 25% catches an order-of-magnitude
      # regression without failing the build on ordinary run-to-run drift.
      - name: Compare
        if: steps.base.outputs.has-suite == 'true'
        run: uv run --no-sync python -m benchmarks.compare /tmp/base.json /tmp/head.json --max-regression=0.25

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate

  minimum-versions:
    name: minimum declared versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      # Resolves every direct dependency at its declared lower bound, so the
      # floors in pyproject.toml stay honest instead of drifting upward
      # silently as the lockfile is refreshed.
      - name: Sync at the lowest declared versions
        run: uv sync --all-extras --resolution lowest-direct

      - name: Test
        run: uv run --no-sync pytest

  latest-versions:
    name: latest released versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      # `minimum-versions` holds the declared floor of every integration extra
      # honest; this holds the other end. `checks` installs what `uv.lock`
      # pins, which is current only as of the last time the lock was
      # refreshed, so neither of the other two jobs would notice a framework
      # release that breaks an integration. A break here is depin's to fix,
      # not upstream's, which is why this job gates rather than advising.
      # `--upgrade` also lifts the default dev group — pytest, coverage, ruff,
      # pydantic — not only the integration extras, and unlike `prerelease`'s
      # `continue-on-error`, that breadth is deliberate: a dev-tool release
      # that breaks the suite is exactly as much depin's to fix as a framework
      # one, so this job gates on both rather than advising on either.
      - name: Sync at the latest released versions
        run: uv sync --upgrade --all-extras

      - name: Test
        run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Build site
        run: uv run --group docs mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Install wheel in a clean env and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "from depin import Container, Token; t = Token[str]('x'); di = Container().value(t, 'hi').freeze(); assert di[t] == 'hi'; import depin; print('pydepin', depin.__version__)"
