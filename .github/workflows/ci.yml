name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      # The `pythonVersion` pinned in pyproject.toml is the floor; the matrix
      # entry is what this job actually runs, and it is what gets checked here.
      - name: Type check
        run: uv run basedpyright --pythonversion ${{ matrix.python-version }}

      - name: Type check with mypy
        run: uv run mypy --python-version ${{ matrix.python-version }}

      # `pytest --cov=depin` starts the coverage collector from inside a
      # pytest-cov plugin hook, which runs after `_preparse` has already
      # loaded every `pytest11` entry point — including `depin.ext.pytest`,
      # which imports the whole `depin` package. `coverage run -m pytest`
      # starts the collector first, before the interpreter imports anything,
      # so it sees that import.
      #
      # One command per step: this matrix includes `windows-latest`, where a
      # multi-command `run:` block exits with the status of its last command
      # alone, so a failing test run followed by a passing report would leave
      # the step green.
      - name: Test
        run: uv run coverage run -m pytest

      - name: Write the coverage XML
        run: uv run coverage xml

      - name: Report coverage
        run: uv run coverage report --show-missing

      # Skipped entirely until CODECOV_TOKEN exists, so the absence of the
      # secret is visible as a skipped step rather than hidden behind a
      # tokenless upload that silently fails.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  free-threaded:
    name: free-threaded ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # The core has zero runtime dependencies and installs on any interpreter.
      # `fastapi` and its compiled transitive dependencies do not ship
      # free-threaded wheels for every version here, so the default dev group is
      # excluded and only the core unit suite runs.
      - name: Sync the thread-test group only
        run: uv sync --no-default-groups --group threads

      # Without this, a build that silently re-enabled the GIL would produce a
      # green job that proves nothing about the library's own locks.
      - name: Assert the GIL is disabled
        run: >
          uv run --no-sync python -c
          "import sys; assert sys._is_gil_enabled() is False, 'the GIL is enabled; this job proves nothing'"

      # No coverage here. This job runs `tests/unit` only, so every module
      # under `depin/ext/` is unexercised and drags the total toward the floor
      # for a reason that has nothing to do with the locks this job tests. The
      # `checks` job measures coverage against the whole suite.
      - name: Test
        run: uv run --no-sync pytest tests/unit

  prerelease:
    name: python 3.15 pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advance warning of an interpreter change, not a merge gate: a pre-release
    # regression is upstream's until it ships.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.15'

      - name: Sync the thread-test group only
        run: uv sync --no-default-groups --group threads

      - name: Test
        run: uv run --no-sync pytest tests/unit

  typing-artifact:
    name: typing artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      # One wheel, built once, checked by every `typing-consumer` job. Building
      # it per checker would let five jobs disagree about what they measured.
      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Check the distribution metadata
        run: uvx twine check dist/*.whl

      # `depin/py.typed` must be in RECORD, not merely in the payload: RECORD is
      # what an installer copies from, and a wheel whose two disagree would type
      # check as untyped in every consumer environment.
      - name: Assert the wheel carries the typing marker
        run: uv run --locked python -m scripts.conformance --verify-artifact --wheel "$(ls dist/*.whl)"

      - name: Upload the wheel
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: typing-wheel
          path: dist/*.whl
          if-no-files-found: error

  typing-consumer:
    name: typing-consumer (${{ matrix.checker }})
    needs: typing-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One job per checker, so the pull request's check list names the checker
      # that broke without a reviewer opening a log. Each job creates its three
      # interpreters once and checks both install modes inside them, which is
      # why the install modes are not a second axis.
      fail-fast: false
      matrix:
        checker: [mypy, pyright, basedpyright, ty, pyrefly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One Python target per pull request, 3.12, and one operating system,
      # Linux. Results were measured byte-identical at 3.12, 3.13 and 3.14 for
      # all five checkers in both install modes, and what a checker infers from
      # a wheel does not vary by host.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Download the wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typing-wheel
          path: dist

      # The checker versions come from `conformance/checkers.toml`, which the
      # local runner reads too, so this job and a contributor's laptop run the
      # same five. Nothing here names a version.
      - name: Run the conformance suite
        run: uv run --locked python -m scripts.conformance --checker ${{ matrix.checker }} --wheel "$(ls dist/*.whl)"

  typing-source:
    name: typing-source (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Blocking, and replacing the advisory `ty` job whose check step ended in
      # `exit 0` and therefore established nothing. mypy and Basedpyright are
      # absent because the `checks` job already runs them over the same file
      # list at zero, on every Python version in the matrix.
      #
      # Stock Pyright runs at zero. ty and Pyrefly run against
      # `conformance/expected/*-source.txt`: the source writes every
      # intentional negative as a `# type: ignore[code]  # pyright:
      # ignore[code]` pair, and ty reads neither spelling, so demanding zero
      # there would mean re-spelling those lines for a pre-1.0 checker whose
      # own `unused-ignore-comment` rule then fires when it renames one.
      fail-fast: false
      matrix:
        checker: [pyright, ty, pyrefly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      # The registers were measured against these interpreters' third-party
      # annotations — four of ty's entries come from resolving
      # `taskiq.TaskiqResult` through pydantic — so the extras are not optional
      # here.
      - name: Sync dependencies
        run: uv sync --locked --all-extras --group bench

      - name: Check the repository source
        run: uv run --locked python -m scripts.conformance --source --checker ${{ matrix.checker }}

  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Both revisions are measured on this runner, interleaved. A baseline
      # stored in the repository would have been measured on a different
      # machine, and the comparison would report hardware rather than code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          # The syncs below run only when the base branch carries the harness;
          # when it doesn't, nothing here ever installs, and the cache post-step
          # then errors because there is nothing to save.
          enable-cache: false

      - name: Prepare the base revision
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git worktree add /tmp/base "origin/${BASE_REF}"
          if [ ! -d /tmp/base/benchmarks/harness ]; then
            echo "base branch carries no measurement harness; nothing to compare against, skipping the gate"
            echo 'has-harness=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has-harness=true' >> "$GITHUB_OUTPUT"

      - name: Install both benchmark environments
        if: steps.base.outputs.has-harness == 'true'
        run: |
          set -euo pipefail
          uv sync --no-default-groups --group bench
          cd /tmp/base && uv sync --no-default-groups --group bench

      # Independent process-level repetitions, alternating which revision runs
      # first. One complete run of the base followed by one of the head would
      # turn any drift over the job — thermal behaviour, frequency scaling, a
      # noisy neighbour — into a systematic bias favouring whichever ran first.
      - name: Measure both revisions
        if: steps.base.outputs.has-harness == 'true'
        run: >
          uv run --no-sync python -m benchmarks.harness.pairs
          --base-dir /tmp/base --head-dir . --repetitions 5 --out /tmp/measurements

      - name: Compare
        id: gate
        if: steps.base.outputs.has-harness == 'true'
        run: |
          set +e
          uv run --no-sync python -m benchmarks.harness.gate /tmp/measurements --budgets benchmarks/budgets.toml
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # 3 is "the point estimate is over budget but its interval still spans
          # it". Re-measured once below; every other code is final here.
          if [ "${code}" = "3" ]; then exit 0; fi
          exit "${code}"

      # One escalation, at double the repetitions, and its verdict stands. A
      # second inconclusive fails: unlimited retries are how a real regression
      # eventually lands in a green run.
      - name: Re-measure an inconclusive verdict
        if: steps.gate.outputs.code == '3'
        run: |
          set -euo pipefail
          uv run --no-sync python -m benchmarks.harness.pairs \
            --base-dir /tmp/base --head-dir . --repetitions 10 --out /tmp/escalated
          uv run --no-sync python -m benchmarks.harness.gate /tmp/escalated --budgets benchmarks/budgets.toml

      - name: Upload the measurements
        if: always() && steps.base.outputs.has-harness == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: benchmark-measurements
          path: |
            /tmp/measurements
            /tmp/escalated
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate

  minimum-versions:
    name: minimum declared versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      # Resolves every direct dependency at its declared lower bound, so the
      # floors in pyproject.toml stay honest instead of drifting upward
      # silently as the lockfile is refreshed.
      - name: Sync at the lowest declared versions
        run: uv sync --all-extras --resolution lowest-direct

      - name: Test
        run: uv run --no-sync pytest

  latest-versions:
    name: latest released versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      # `minimum-versions` holds the declared floor of every integration extra
      # honest; this holds the other end. `checks` installs what `uv.lock`
      # pins, which is current only as of the last time the lock was
      # refreshed, so neither of the other two jobs would notice a framework
      # release that breaks an integration. A break here is depin's to fix,
      # not upstream's, which is why this job gates rather than advising.
      # `--upgrade` also lifts the default dev group — pytest, coverage, ruff,
      # pydantic — not only the integration extras, and unlike `prerelease`'s
      # `continue-on-error`, that breadth is deliberate: a dev-tool release
      # that breaks the suite is exactly as much depin's to fix as a framework
      # one, so this job gates on both rather than advising on either.
      - name: Sync at the latest released versions
        run: uv sync --upgrade --all-extras

      - name: Test
        run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Build site
        run: uv run --group docs mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Install wheel in a clean env and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "from depin import Container, Token; t = Token[str]('x'); di = Container().value(t, 'hi').freeze(); assert di[t] == 'hi'; import depin; print('pydepin', depin.__version__)"
