version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Runtime dependencies of the fastapi extra. Grouped so a bump lands with
      # its peers instead of alone: raising the starlette floor on its own once
      # made the declared fastapi floor unsatisfiable.
      python-runtime:
        dependency-type: "production"
        patterns: ["*"]
      python-dev:
        dependency-type: "development"
        patterns: ["*"]
