# Per-workload regression budgets, and the measurement each one rests on.
#
# A uniform threshold cannot be right: measured per-workload dispersion on the
# reference host spans an order of magnitude, so one number is simultaneously too
# loose for the quiet workloads and too tight for the noisy ones. Each latency
# budget below is twice that workload's own measured paired null p99, floored by
# the band it falls in - 5% low, 8% medium, 15% high.
#
# Derived from a paired null collection: 10 runs of identical code,
# 5 per side, with the statistic evaluated over every split of those
# runs into two halves (1512 trials per workload).
#
# Regenerate by the procedure in docs/performance/methodology.md. Never widen a
# budget to make a failing pull request green: benchmarks/harness/budgets.py
# refuses a latency limit under its class floor, and refuses to loosen any of the
# deterministic budgets at all.

[[budget]]
workload = "build_the_graph_view"
metric = "latency"
limit = 0.05
noise = "low"
justification = "paired null p99 1.92% over 1512 trials from 10 runs of identical code"

