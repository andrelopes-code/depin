site_name: depin
site_description: Type-first dependency injection for Python
site_url: https://andrelopes-code.github.io/depin/
repo_url: https://github.com/andrelopes-code/depin
repo_name: andrelopes-code/depin

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            inherited_members: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guide:
      - Overview: guide/index.md
      - Lifetimes and scopes: guide/lifetimes.md
      - Composing bindings: guide/composition.md
      - Resolution semantics: guide/resolution.md
      - Testing: guide/testing.md
      - Inspecting the graph: guide/diagnostics.md
      - Warmup and health: guide/operations.md
      - Writing an integration: guide/integrations.md
      - FastAPI: guide/fastapi.md
  - Performance:
      - Overview: performance/index.md
      - Methodology: performance/methodology.md
      - Results: performance/results.md
      - Reproducing: performance/reproducing.md
  - Support policy: support-policy.md
  - Reference:
      - Overview: reference/index.md
      - Container & Registry: reference/container.md
      - FrozenContainer: reference/frozen.md
      - Scope: reference/scope.md
      - Markers: reference/markers.md
      - Errors: reference/errors.md
      - Graph diagnostics: reference/diagnostics.md
      - Warmup and health: reference/operations.md
      - Integration contract: reference/hosting.md
      - ASGI request scope: reference/asgi.md
      - WSGI request scope: reference/wsgi.md
      - Command scope: reference/cli.md
      - Starlette: reference/starlette.md
      - FastAPI: reference/fastapi.md
      - Litestar: reference/litestar.md
      - Flask: reference/flask.md
      - Click: reference/click.md
      - Typer: reference/typer.md
      - Taskiq: reference/taskiq.md
      - pytest: reference/pytest.md
